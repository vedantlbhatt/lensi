name: ios

# Real-Apple checks for the parts Linux can't run: converts and verifies the
# SAM Core ML models, builds the app for the iOS 27 Simulator, drives a few
# scripted captures through deep links and screenshots them. Everything a
# person (or agent) needs to look at is pushed to the `ci-results` branch.

on:
  push:
    branches: [camera-first, main]
    paths-ignore: ['**/*.md', 'tools/sam/report/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sam:
    name: SAM models + eyes
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tools/sam/requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/lensi-sam
          key: lensi-sam-${{ hashFiles('tools/sam/convert.py', 'tools/sam/sam_common.py') }}
      - name: Install
        run: pip install -r tools/sam/requirements.txt
      - name: Convert MobileSAM to Core ML
        run: python tools/sam/convert.py --out build/sam 2>&1 | tee build-convert.txt
      - name: Compile .mlmodelc
        run: |
          mkdir -p out/models
          xcrun coremlcompiler compile build/sam/LensiSAMEncoder.mlpackage out/models/
          xcrun coremlcompiler compile build/sam/LensiSAMDecoder.mlpackage out/models/
          du -sh out/models/* | tee out/model-sizes.txt
      - name: Eyes on public images (Vision + YOLO + SAM)
        run: |
          set -o pipefail
          mkdir -p eyes-in models-all out/eyes
          cp app/assets/demo/*.jpg eyes-in/
          for u in \
            facebookresearch/segment-anything/main/notebooks/images/truck.jpg \
            facebookresearch/segment-anything/main/notebooks/images/groceries.jpg \
            facebookresearch/segment-anything/main/notebooks/images/dog.jpg \
            facebookresearch/sam2/main/notebooks/images/cars.jpg \
            ultralytics/ultralytics/main/ultralytics/assets/bus.jpg \
            opencv/opencv/4.x/samples/data/imageTextN.png \
            opencv/opencv/4.x/samples/data/board.jpg \
            zxing/zxing/master/core/src/test/resources/blackbox/qrcode-1/1.png \
            pjreddie/darknet/master/data/dog.jpg \
            pjreddie/darknet/master/data/kite.jpg; do
            curl -fsSL -o "eyes-in/public-$(echo "$u" | tr '/' '_' | tail -c 60)" "https://raw.githubusercontent.com/$u" || echo "skip $u"
          done
          cp -R out/models/*.mlmodelc models-all/
          cp -R app/modules/lensi-ar/ios/Models/yolo11n.mlmodelc models-all/
          swiftc -O -o eyes tools/eyes/main.swift \
            app/modules/lensi-ar/ios/Analyzer.swift app/modules/lensi-ar/ios/Detector.swift app/modules/lensi-ar/ios/SAMSegmenter.swift
          LENSI_MODELS_DIR=models-all ./eyes eyes-in out/eyes 2>&1 | tee out/eyes.txt
      - name: Verify with Core ML (CPU)
        run: python tools/sam/verify_coreml.py --models build/sam --compute-units CPU_ONLY 2>&1 | tee out/verify-cpu.txt
      - name: Verify with Core ML (all compute units)
        if: always()
        run: python tools/sam/verify_coreml.py --models build/sam --compute-units ALL 2>&1 | tee out/verify-all.txt
      - if: always()
        run: cp build-convert.txt out/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sam
          path: out/

  app:
    name: Simulator build + screenshots
    runs-on: xcode-27
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: npm ci
        working-directory: app
        run: npm ci --no-audit --no-fund
      - name: Typecheck + unit tests
        working-directory: app
        run: |
          npx tsc --noEmit
          npx -y tsx --test src/lib/__tests__/*.test.ts
      - name: ccache
        run: |
          brew list ccache >/dev/null 2>&1 || brew install ccache
          # The Podfile routes clang through ccache when this is set. Xcode doesn't pass the
          # shell's CCACHE_* variables to the compiler, so ccache keeps its default directory
          # (~/Library/Caches/ccache), and that is what gets cached between runs.
          echo "USE_CCACHE=1" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ccache
          key: ccache-ios-${{ hashFiles('app/package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ccache-ios-${{ hashFiles('app/package-lock.json') }}-
            ccache-ios-
      - name: Prebuild
        working-directory: app
        env:
          EXPO_NO_TELEMETRY: 1
          CI: 1
        run: npx expo prebuild --platform ios --no-install
      - name: Pods
        working-directory: app/ios
        # Pods download large prebuilt binaries; one dropped connection shouldn't cost the run.
        run: pod install || { echo "pod install failed; retrying once"; sleep 15; pod install; }
      - name: Build (Release, Simulator)
        working-directory: app
        run: |
          set -o pipefail
          mkdir -p ../out
          # One architecture, the runner's own: a generic Simulator destination otherwise builds
          # every file for both arm64 and x86_64, and only the native one ever runs here.
          xcodebuild -workspace ios/Lensi.xcworkspace -scheme Lensi -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' ARCHS="$(uname -m)" \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO build \
            > ../out/xcodebuild.log 2>&1 || { grep -E "error:|fatal error|Undefined symbol|ld: " ../out/xcodebuild.log | head -150 > ../out/build-errors.txt; cat ../out/build-errors.txt; exit 1; }
          grep -E "warning: .*(LensiAR|lensi-ar)" ../out/xcodebuild.log | sort -u | head -100 > ../out/lensi-warnings.txt || true
          { uname -m; ccache -s; } > ../out/ccache-stats.txt 2>&1 || true
      - name: Run in Simulator
        working-directory: app
        run: bash ../.github/scripts/simulator-shots.sh build/Build/Products/Release-iphonesimulator/Lensi.app ../out/shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app
          path: out/

  publish:
    name: Publish results
    needs: [sam, app]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: results
      - name: Shrink videos
        # Simulator recordings run 10-100+ MB each at full resolution (the camera run once hit
        # 107 MB, past GitHub's file limit, and the push was refused). 720 wide is plenty to review.
        run: |
          cd results
          { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; } >/dev/null 2>&1 || echo "no ffmpeg; keeping originals"
          find . -name '*.mp4' | while read -r f; do
            if command -v ffmpeg >/dev/null; then
              ffmpeg -nostdin -v error -y -i "$f" -an -vf "scale=720:-2,fps=30" -c:v libx264 -preset veryfast -crf 24 \
                -pix_fmt yuv420p -movflags +faststart "${f%.mp4}.small.mp4" && mv "${f%.mp4}.small.mp4" "$f"
            fi
            if [ "$(stat -c %s "$f")" -gt 95000000 ]; then echo "dropped $f (over 95 MB)" | tee -a dropped.txt; rm -f "$f"; fi
          done
          du -sh .
      - name: Push to ci-results
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN: ${{ github.run_id }}
          SAM: ${{ needs.sam.result }}
          APP: ${{ needs.app.result }}
        run: |
          cd results
          printf "commit %s\nrun %s\nsam %s\napp %s\n" "$SHA" "$RUN" "$SAM" "$APP" > STATUS.txt
          git init -q
          git checkout -q -b ci-results
          git add -A
          git -c user.name="lensi-ci" -c user.email="ci@users.noreply.github.com" commit -q -m "CI results for $SHA (run $RUN)"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${REPO}.git" ci-results
