name: iphone

# Lensi on an iPhone without TestFlight or the App Store: an ad hoc build, signed with the
# team's App Store Connect API key the way testflight.yml signs (Xcode's cloud-managed
# certificates: nothing stored here), that installs on the iPhones registered with the team
# (the repository variable IPHONE_UDIDS registers new ones). It goes on the `iphone` release
# with an install manifest; on the iPhone, open this in Safari and tap Install:
#
#   itms-services://?action=download-manifest&url=https://raw.githubusercontent.com/vedantlbhatt/lensi/ota/ios/manifest.plist
#
# From then on JavaScript changes arrive over the air (ota.yml, src/lib/ota.ts); a change to
# native code needs this again. Needs the secrets ASC_KEY_ID, ASC_ISSUER_ID and ASC_KEY_P8.
on:
  workflow_dispatch:
  push:
    branches: [iphone]

permissions:
  contents: write

jobs:
  build:
    name: Build for iPhone (ad hoc)
    runs-on: xcode-27
    timeout-minutes: 110
    concurrency:
      group: iphone
      cancel-in-progress: false
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      IPHONE_UDIDS: ${{ vars.IPHONE_UDIDS }}
      BUNDLE_ID: com.vedantbhatt.lensi
      TEAM_ID: A4YA8NU8Y8
    outputs:
      build: ${{ steps.number.outputs.build }}
    steps:
      - name: App Store Connect key
        run: |
          missing=""
          for s in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do [ -z "${!s}" ] && missing="$missing $s"; done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing (an App Store Connect API team key with Admin access: Settings > Secrets and variables > Actions)."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
          echo "KEY_PATH=$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" >> "$GITHUB_ENV"
          python3 -m pip install --quiet --break-system-packages 'pyjwt[crypto]' 2>/dev/null || python3 -m pip install --quiet 'pyjwt[crypto]'
      - uses: actions/checkout@v4
      - name: iPhones it installs on
        run: python3 .github/scripts/asc.py devices
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: npm ci
        working-directory: app
        run: npm ci --no-audit --no-fund
      - name: Prebuild
        working-directory: app
        env:
          EXPO_NO_TELEMETRY: 1
          CI: 1
        run: |
          npx expo prebuild --platform ios --no-install
          echo "runtime $(/usr/libexec/PlistBuddy -c 'Print :LensiRuntime' ios/Lensi/Info.plist)" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Pods
        working-directory: app/ios
        run: pod install || { echo "pod install failed; retrying once"; sleep 15; pod install; }
      - name: Build number
        id: number
        working-directory: app
        run: |
          BUILD=$(( ${{ github.run_number }} + 1000 ))
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD" ios/Lensi/Info.plist
          echo "BUILD=$BUILD" >> "$GITHUB_ENV"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' ios/Lensi/Info.plist)" >> "$GITHUB_ENV"
      - name: Archive (Release, iPhone)
        working-directory: app
        env:
          # The built-in JavaScript knows which commit it is, so the same commit isn't fetched over the air.
          EXPO_PUBLIC_LENSI_UPDATE: ${{ github.sha }}
        run: |
          set -o pipefail
          mkdir -p ../out
          xcodebuild -workspace ios/Lensi.xcworkspace -scheme Lensi -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Lensi.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" COMPILER_INDEX_STORE_ENABLE=NO \
            -allowProvisioningUpdates -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            archive > ../out/archive.log 2>&1 || { grep -E "error:|fatal error|Signing|signing|provision|certificate|Undefined symbol" ../out/archive.log | sort -u | head -80; exit 1; }
          tail -3 ../out/archive.log
      - name: Export (ad hoc)
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/export.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>release-testing</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>thinning</key><string>&lt;none&gt;</string>
          </dict>
          </plist>
          EOF
          mkdir -p out
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Lensi.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            > out/export.log 2>&1 || { tail -60 out/export.log; exit 1; }
          tail -4 out/export.log
          mkdir -p dist
          mv "$RUNNER_TEMP/export/Lensi.ipa" "dist/Lensi-$BUILD.ipa"
          ls -la dist
      - name: Install manifest
        run: |
          cat > dist/manifest.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>items</key>
            <array>
              <dict>
                <key>assets</key>
                <array>
                  <dict>
                    <key>kind</key><string>software-package</string>
                    <key>url</key><string>https://github.com/${{ github.repository }}/releases/download/iphone/Lensi-$BUILD.ipa</string>
                  </dict>
                </array>
                <key>metadata</key>
                <dict>
                  <key>bundle-identifier</key><string>$BUNDLE_ID</string>
                  <key>bundle-version</key><string>$VERSION</string>
                  <key>kind</key><string>software</string>
                  <key>title</key><string>Lensi</string>
                </dict>
              </dict>
            </array>
          </dict>
          </plist>
          EOF
          plutil -lint dist/manifest.plist
      - name: Publish on the iphone release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh release view iphone >/dev/null 2>&1 || gh release create iphone --prerelease --title "Lensi for iPhone" \
            --notes "Ad hoc builds for the registered iPhones (iphone.yml). On the iPhone, open the install link from the workflow summary in Safari."
          gh release upload iphone "dist/Lensi-$BUILD.ipa" dist/manifest.plist --clobber
          for a in $(gh release view iphone --json assets -q '.assets[].name' | grep -E '^Lensi-[0-9]+\.ipa$' | grep -v "^Lensi-$BUILD.ipa$"); do
            gh release delete-asset iphone "$a" -y
          done
      - uses: actions/upload-artifact@v4
        with:
          name: manifest
          path: dist/manifest.plist
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iphone-logs
          path: out/

  link:
    name: Install link
    needs: build
    runs-on: ubuntu-latest
    # One writer to the ota branch at a time (ota.yml publishes there).
    concurrency:
      group: ota-branch
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: manifest
          path: ${{ runner.temp }}/manifest
      - name: Manifest on the ota branch
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/site"
          if git ls-remote --exit-code --heads origin ota >/dev/null; then
            git fetch -q --depth 1 origin ota:refs/remotes/origin/ota
            git archive refs/remotes/origin/ota | tar -x -C "$RUNNER_TEMP/site"
          fi
          mkdir -p "$RUNNER_TEMP/site/ios"
          cp "$RUNNER_TEMP/manifest/manifest.plist" "$RUNNER_TEMP/site/ios/manifest.plist"
          cd "$RUNNER_TEMP/site"
          git init -q -b ota
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "iPhone build ${{ needs.build.outputs.build }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ota
          {
            echo "### Install Lensi (build ${{ needs.build.outputs.build }})"
            echo "On the iPhone, paste this into Safari's address bar and tap Install:"
            echo '```'
            echo "itms-services://?action=download-manifest&url=https://raw.githubusercontent.com/${{ github.repository }}/ota/ios/manifest.plist"
            echo '```'
            echo "If Safari won't open it, the same manifest from the release:"
            echo '```'
            echo "itms-services://?action=download-manifest&url=https://github.com/${{ github.repository }}/releases/download/iphone/manifest.plist"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
