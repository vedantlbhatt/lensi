name: track-lab

# Footage experiments for live SAM tracking (tools/track) without the app build: a push to
# track-lab lands its results on the ci-track-lab branch in about ten minutes, and doesn't
# cancel the full ios run on camera-first.

on:
  push:
    branches: [track-lab]
  workflow_dispatch:

permissions:
  contents: write

# A newer push cancels the run in progress, and the steps after a failed one still run (but not
# after a cancel: with always() they did, and a cancelled run held the runner until its timeout).
concurrency:
  group: track-lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  footage:
    name: Live SAM on real footage
    runs-on: xcode-27
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tools/sam/requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/lensi-sam
          key: lensi-sam-${{ hashFiles('tools/sam/convert.py', 'tools/sam/sam_common.py') }}
      - name: Install
        run: pip install -r tools/sam/requirements.txt
      - name: Convert MobileSAM to Core ML
        run: |
          python tools/sam/convert.py --out build/sam
          mkdir -p models-all
          xcrun coremlcompiler compile build/sam/LensiSAMEncoder.mlpackage models-all/
          xcrun coremlcompiler compile build/sam/LensiSAMDecoder.mlpackage models-all/
          cp -R app/modules/lensi-ar/ios/Models/yolo11n.mlmodelc models-all/
          cp -R app/modules/lensi-ar/ios/Models/EdgeTAM*.mlmodelc models-all/
      - uses: actions/cache@v4
        with:
          path: footage/DAVIS
          key: davis-2017-480p-tracking-v2
      # A commit saying [track only] runs the footage alone (tools/track), in about ten minutes.
      - name: Pinning on handheld walk-arounds, the depth guessed wrong (tools/walk)
        if: ${{ !contains(github.event.head_commit.message, '[track only]') }}
        env:
          # The walks pass 1 found best last time (scans whose thing was hidden where it was
          # pinned left out); empty to look through the scans again.
          WALK_IDS: 42446522 44358435 47895556 47331322 42898497 42897538 47332911 42898826 47334234 47895534
        run: bash tools/walk/ci.sh
      - name: Push the walk-arounds to ci-track-lab
        if: ${{ !cancelled() }}
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          [ -d out/walk ] || exit 0
          rm -rf ../ci-walk && mkdir -p ../ci-walk && cp -R out/walk ../ci-walk/walk && cd ../ci-walk
          echo "$SHA" > COMMIT.txt
          git init -q && git checkout -q -b ci-track-lab && git add -A
          git -c user.name="lensi-ci" -c user.email="ci@users.noreply.github.com" commit -q -m "Walk-arounds for $SHA"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${REPO}.git" ci-track-lab
      - name: ARKit pinning on real ARKit recordings
        if: ${{ !cancelled() && !contains(github.event.head_commit.message, '[track only]') }}
        run: bash tools/pin/ci.sh
      # [walk only] leaves the footage out: the walk-arounds and ARKit recordings in about an hour.
      - name: Live SAM on real footage
        if: ${{ !cancelled() && !contains(github.event.head_commit.message, '[walk only]') }}
        run: bash tools/track/ci.sh lensi@4
      - name: Push results to ci-track-lab
        if: ${{ !cancelled() }}
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          mkdir -p out/track
          [ -d out/pin ] && cp -R out/pin out/track/pin
          [ -d out/walk ] && cp -R out/walk out/track/walk
          [ -n "$(ls out/track)" ] || exit 0
          rm -rf ../ci-track && cp -R out/track ../ci-track && cd ../ci-track
          echo "$SHA" > COMMIT.txt
          git init -q && git checkout -q -b ci-track-lab && git add -A
          git -c user.name="lensi-ci" -c user.email="ci@users.noreply.github.com" commit -q -m "Tracking results for $SHA"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${REPO}.git" ci-track-lab
